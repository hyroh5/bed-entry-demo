name: Build unsigned IPA

# 서명 없이 IPA를 만든다. 설치는 Sideloadly 등에서 본인 Apple ID로 서명해서 한다.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project SleepDemo.xcodeproj \
            -scheme SleepDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SleepDemo.app Payload/
          zip -qry SleepDemo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SleepDemo-ipa
          path: SleepDemo.ipa
          retention-days: 14
