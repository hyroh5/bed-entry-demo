name: SleepDemo
options:
  bundleIdPrefix: com.hyroh5
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  SleepDemo:
    type: application
    platform: iOS
    sources: [SleepDemo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyroh5.bedentrydemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 입면 수집
        INFOPLIST_KEY_NSMotionUsageDescription: 잠자리 진입 데이터를 수집하기 위해 기기 자세와 움직임을 기록합니다.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 측정 중 위치와 집까지 거리를 기록하기 위해 위치를 사용합니다.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    scheme:
      testTargets: [SleepDemoTests]
  SleepDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SleepDemoTests]
    dependencies:
      - target: SleepDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hyroh5.bedentrydemo.tests
