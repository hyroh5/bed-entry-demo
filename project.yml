name: SleepDemo
options:
  bundleIdPrefix: com.jeongdaegyun
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: GFZ4D8P8HT
    CODE_SIGN_STYLE: Automatic
targets:
  SleepDemo:
    type: application
    platform: iOS
    sources: [SleepDemo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeongdaegyun.sleepdemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 잠자리 감지
        INFOPLIST_KEY_NSMotionUsageDescription: 기기 자세와 움직임으로 잠자리 진입 여부를 추정하기 위해 모션 센서를 사용합니다.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 현재 위치가 등록한 집 반경 안인지 확인하기 위해 위치를 사용합니다.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    scheme:
      testTargets: [SleepDemoTests]
  SleepDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SleepDemoTests]
    dependencies:
      - target: SleepDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jeongdaegyun.sleepdemo.tests
